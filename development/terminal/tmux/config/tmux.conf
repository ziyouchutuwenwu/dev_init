# 按键透传
setw -g allow-passthrough on

# ------------------------------------------------------------------------------
# session 操作快捷键 (ctrl + s 前缀)
# ------------------------------------------------------------------------------
bind -T root C-s switch-client -T session-table
bind -T session-table t choose-tree -s
bind -T session-table n new-session
bind -T session-table d detach-client
bind -T session-table r command-prompt -I "#S" "rename-session '%%'"
# bind -T session-table x confirm-before -p "kill-session #S? (y/n)" "kill-session"
bind -T session-table x kill-session

# ------------------------------------------------------------------------------
# window 操作快捷键 (ctrl + w 前缀)
# ------------------------------------------------------------------------------
unbind C-b
set -g prefix C-w
bind C-w send-prefix

# window 起始索引号
set -g base-index 1
set -g renumber-windows on

# 标签名字跟随鼠标滚动
set -g automatic-rename-format "#{pane_current_command}#{?pane_dead,[dead],}"

# ctrl+w p，弹最顶层模态框
bind p popup -w 80% -h 80% -E

# ctrl+w n，创建 window
bind n new-window -c "#{pane_current_path}"

# 重命名 window (默认填入当前窗口名称，便于直接修改)
bind r command-prompt -I "#W" "rename-window '%%'"
bind x kill-window

# alt 数字切换 window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# alt 左右，切换 window
bind -n M-Left  previous-window
bind -n M-Right next-window

# ctrl+w 左右，移动 window
bind Left swap-window -d -t -1
bind Right swap-window -d -t +1

# ------------------------------------------------------------------------------
# pane 操作快捷键 (ctrl + p 前缀)
# ------------------------------------------------------------------------------
bind -T root C-p switch-client -T pane-table
setw -g pane-base-index 1

# panel 创建
bind -T pane-table h split-window -h -c "#{pane_current_path}"
bind -T pane-table v split-window -v -c "#{pane_current_path}"

# panel 跳转
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D

# ctrl+p 上下左右，移动 panel
bind -T pane-table Left swap-pane -t '{left-of}'
bind -T pane-table Right swap-pane -t '{right-of}'
bind -T pane-table Up swap-pane -t '{up-of}'
bind -T pane-table Down swap-pane -t '{down-of}'

# panel 缩放
bind -T pane-table z resize-pane -Z

# ctrl+p x， 关闭 panel
bind -T pane-table x kill-pane

# panel 水平垂直切换
bind -T pane-table Space select-layout even-horizontal
bind -T pane-table Enter select-layout even-vertical

# panel 边框颜色
set -g pane-border-indicators 'off'
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# 多 panel 同步，目标为整个 window 里面的所有 panel (ctrl+p s 切换)
bind -T pane-table s if-shell -F "#{pane_synchronized}" "set-window-option synchronize-panes off" "set-window-option synchronize-panes on"

# ctrl+p r，重命名 pane
bind -T pane-table r command-prompt -I "#T" "select-pane -T '%%'"

# ------------------------------------------------------------------------------
# 复制粘贴与鼠标滚轮
# ------------------------------------------------------------------------------
setw -g mode-keys vi
set -g set-clipboard on

# 粘贴 ctrl+shift+v
bind -n C-S-v paste-buffer

# 鼠标支持
set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# 滚轮每次滚动 3 行
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind-key -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 3 scroll-up
bind-key -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 3 scroll-down

# 右侧的滚动条
set -g pane-scrollbars on
set -g pane-scrollbars-position right

# ==============================================================================
# 状态栏
# ==============================================================================

# [+] 直接新建窗口
bind -n MouseDown1StatusLeft new-window -c "#{pane_current_path}"

# 双击标签重命名窗口
bind -n DoubleClick1Status command-prompt -I "#W" "rename-window -t = '%%'"

# [x] 关闭窗口
bind -n MouseDown1StatusRight if -F '#{e|>=:#{mouse_x},#{e|-:#{client_width},3}}' 'kill-pane'

# ==============================================================================
# 状态栏底部美化
# ==============================================================================
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# 左侧: 仅保留绿色 [+] 按钮，点击即可新建窗口
set -g status-left-style default
set -g status-left-length 10
set -g status-left "#[bg=#9ece6a]#[fg=#1a1b26]#[bold] + #[default] "

# 右侧: 时间显示 + 最右侧 [x] (占最后 3 格，点击关闭窗格)
set -g status-right-style default
set -g status-right-length 100
set -g status-right "#[bg=#7aa2f7]#[fg=#1a1b26]#[bold] %Y-%m-%d %H:%M:%S #[bg=#f7768e]#[fg=#1a1b26]#[bold] x #[default]"

# 窗口列表样式
# 当前窗口正常为蓝底黑字
# syncing 变为与最右侧[x]按钮一致的红底黑字，醒目且不刺眼
set -g window-status-separator " "
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#[fg=#a9b1d6]#[bg=#3b4261] #W "
set -g window-status-current-format "#{?pane_synchronized,#[bg=#f7768e]#[fg=#1a1b26]#[bold] #W [syncing] ,#[bg=#7aa2f7]#[fg=#1a1b26]#[bold] #W }"

# rename window 的时候的样式
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold,fill=#7aa2f7"
set -g message-command-style "bg=#3b4261,fg=#a9b1d6,fill=#3b4261"
